<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>MEL RIBBON サンプル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Noto+Serif+JP:ital,wght@0,400;0,500&amp;family=Pinyon+Script&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div class="sample">これはデザイン確認用のサンプルです。購入はできません。</div>
<div class="notice">[金額]円以上のお買い上げで送料無料</div>
<header class="site-header">
  <div class="head-left">
    <a class="icon" href="index.html" aria-label="トップページに戻る"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
  </div>
  <a class="logo" href="index.html">Mel Ribbon</a>
  <div class="head-right">
    <button class="icon" type="button" data-sample aria-label="カートを開く"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M4 9h16l-1 12H5L4 9Z"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></svg><span class="count" hidden>0</span></button>
  </div>
</header>

<nav class="crumbs" aria-label="パンくず"><a href="index.html">Home</a><span>/</span><span id="crumb-name"></span></nav>

<main>
  <div class="buy">
    <div class="gallery">
      <div class="main" id="main-photo">[着用写真 縦長]<div class="fit">モデル: [ ] cm / 着用サイズ: [ ]</div></div>
      <div class="thumbs" aria-label="写真を選ぶ">
        <button class="thumb dark" type="button" data-tone="dark" aria-label="写真1" aria-pressed="true"></button>
        <button class="thumb mid" type="button" data-tone="mid" aria-label="写真2" aria-pressed="false"></button>
        <button class="thumb pale" type="button" data-tone="pale" aria-label="写真3" aria-pressed="false"></button>
        <button class="thumb dark" type="button" data-tone="dark" aria-label="写真4" aria-pressed="false"></button>
      </div>
    </div>
    <section class="info">
      <a href="index.html#temp" id="item-tag"></a>
      <div class="model">[モデル名]</div>
      <h1 id="item-name"></h1>
      <div class="big-price">[価格]</div>
      <div><b>カラー:</b> ブラック</div>
      <div><b>サイズ:</b></div>
      <div class="opts">
        <button class="size" type="button" aria-pressed="true">S</button>
        <button class="size" type="button" aria-pressed="false">M</button>
        <button class="size" type="button" aria-pressed="false">L</button>
      </div>
      <button class="cart-btn" type="button">カートに追加</button>
      <p>[金額]円以上で送料無料です</p>
    </section>
  </div>

  <section class="panel" aria-labelledby="feat-title">
    <h2 class="h-sm" id="feat-title">アイテムの特徴</h2>
    <div class="feat"><b>伸縮性</b><div><div class="bar"><i style="left:50%"></i></div><div class="ends"><span>なし</span><span>良い</span></div></div></div>
    <div class="feat"><b>厚さ</b><div><div class="bar"><i style="left:45%"></i></div><div class="ends"><span>薄い</span><span>厚い</span></div></div></div>
    <div class="feat"><b>フィット性</b><div><div class="bar"><i style="left:18%"></i></div><div class="ends"><span>スリム</span><span>ルーズ</span></div></div></div>
    <div class="feat"><b>透け感</b><div><div class="bar"><i style="left:80%"></i></div><div class="ends"><span>あり</span><span>なし</span></div></div></div>
    <div class="feat"><b>肌触り</b><div><div class="bar"><i style="left:60%"></i></div><div class="ends"><span>チクチク</span><span>柔らかい</span></div></div></div>
  </section>

  <section class="panel model-card" aria-label="モデル情報"><div class="avatar"></div><div><b>[モデル名]</b><br>[身長] cm ／ [体型]</div></section>

  <section class="more" aria-labelledby="more-title">
    <h2 class="h-sm" id="more-title">おすすめのアイテム</h2>
    <div class="grid" id="more-grid"></div>
  </section>
</main>

<footer class="foot">
  <div class="foot-title">Menu</div>
  <a href="index.html">Home</a>
  <a href="#" data-sample>特定商取引法に基づく表記</a>
</footer>
<script src="app.js"></script>
</body>
</html>
