<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>NOELLE サンプル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;700&amp;family=Lato:wght@300;400;700&amp;family=Libre+Caslon+Display&amp;family=Noto+Sans+JP:wght@400;500;700&amp;family=Noto+Serif+JP:wght@400&amp;family=Nunito+Sans:opsz,wght@6..12,400;6..12,500;6..12,700&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div class="sample">これはデザイン確認用のサンプルです。購入はできません。</div>
<header class="site-header">
  <div class="head-side">
    <a class="round" href="index.html" aria-label="トップページに戻る"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
  </div>
  <a class="logo" href="index.html">NOELLE</a>
  <div class="head-side right">
    <button class="round" type="button" data-sample aria-label="カートを開く"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true"><path d="M4 9h16l-1 12H5L4 9Z"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></svg><span class="count" hidden>0</span></button>
  </div>
</header>
<nav class="crumbs" aria-label="パンくず"><a href="index.html">Home</a><span>/</span><span id="crumb-name"></span></nav>

<main>
  <div class="buy">
    <div class="gallery">
      <div class="main" id="main-photo">[着用写真]<div class="fit">モデル [ ]cm / [ ]サイズ着用</div></div>
      <div class="thumbs" aria-label="写真を選ぶ">
        <button class="thumb dark" type="button" data-tone="dark" aria-label="写真1" aria-pressed="false"></button>
        <button class="thumb deep" type="button" data-tone="deep" aria-label="写真2" aria-pressed="false"></button>
        <button class="thumb mid" type="button" data-tone="mid" aria-label="写真3" aria-pressed="false"></button>
        <button class="thumb pale" type="button" data-tone="pale" aria-label="写真4" aria-pressed="false"></button>
      </div>
    </div>
    <section class="item">
      <a class="item-tag" href="index.html#temp" id="item-tag"></a>
      <h1 id="item-name"></h1>
      <div class="big-price">[価格]</div>
      <div class="opt-label">COLOR：<span id="item-color"></span></div>
      <div class="opt-label">SIZE</div>
      <div class="opts"></div>
      <button class="cart-btn" type="button">カートに追加</button>
      <p class="note">[送料のご案内]</p>
    </section>
  </div>

  <section class="panel" aria-labelledby="about-title">
    <h2 class="h-sm" id="about-title">ABOUT</h2>
    <p>[この服の特徴と合わせ方を2〜3行で書く]</p>
  </section>

  <section class="panel" aria-labelledby="size-title">
    <h2 class="h-sm" id="size-title">SIZE</h2>
    <table class="size-table">
      <thead><tr><th>サイズ</th><th>着丈</th><th>身幅</th><th>袖丈</th></tr></thead>
      <tbody>
        <tr><td>S</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr>
        <tr><td>M</td><td>[ ]</td><td>[ ]</td><td>[ ]</td></tr>
      </tbody>
    </table>
    <p style="margin-top:12px">素材：[繊維名と%]</p>
  </section>

  <section class="panel model-card" aria-label="モデル情報"><div class="avatar"></div><div><b>[モデル名]</b><br>[身長]cm</div></section>

  <section class="soft" aria-labelledby="more-title">
    <h2 class="heading" id="more-title">RECOMMEND</h2>
    <div class="grid" id="more-grid"></div>
  </section>
</main>

<footer class="foot">
  <h2>ABOUT</h2>
  <nav class="legal" aria-label="規約">
    <a href="#" data-sample>プライバシーポリシー</a>
    <a href="#" data-sample>利用規約</a>
    <a href="#" data-sample>特定商取引法表記</a>
  </nav>
</footer>
<script src="app.js?v=5"></script>
</body>
</html>
